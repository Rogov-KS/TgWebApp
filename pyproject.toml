[project]
name = "tg-snake-backend"
version = "0.1.0"
description = "Backend for Telegram Snake Web App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.25.0",
    "python-telegram-bot>=20.7",
    "asyncpg>=0.30.0",
    "cfgv>=3.4.0",
    "pydantic[email]>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "jinja2>=3.1.6",
    "aiohttp>=3.12.15",
    "aiosmtplib>=4.0.1",
    "celery>=5.5.3",
    "flower>=2.0.1",
    "fastapi-cache2[redis]>=0.2.2",
    "fastapi[standard]>=0.116.0",
    "sqladmin[full]>=0.21.0",
    "python-json-logger>=3.3.0",
    "sentry-sdk[fastapi]>=2.34.1",
    "fastapi-versioning>=0.10.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "EXE", "FA", "ICN", "INP", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = ["E501", "B008", "C901", "RUF002", "RUF003", "PGH004", "UP046", "RET504"]

# Настройки для сортировки импортов
[tool.ruff.isort]
known-first-party = ["app"]
known-third-party = ["fastapi", "uvicorn", "pydantic", "sqlalchemy", "alembic", "redis", "httpx", "telegram", "asyncpg"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]
