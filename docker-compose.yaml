  # # Flower Layer - Flower
  # flower:
  #   image: tg_web_app_flower
  #   container_name: tg_web_app_flower
  #   build:
  #     context: .
  #     dockerfile: ${DOCKER_FILE:-Dockerfile}
  #   command: sh -c "celery -A backend.celery_app.app:celery_app flower --port=5555"
  #   # При запуске через nginx необходимо запускать команду ниже для корректной работы js и css
  #   # command: sh -c "celery --app=app.tasks.celery:celery flower --url_prefix=/flower"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - ./configs/envs/.env-prod
  #   ports:
  #     - "5550:5555"
  #     # - "${FLOWER_PORT}:5555"
  #   networks:
  #     - app-network
  #   restart: unless-stopped


  # Monitoring Dashboard - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      prometheus:
        condition: service_healthy
    env_file:
      - ./configs/envs/.env-prod
    ports:
      - "3333:3000"
      # - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./configs/grafana/example-dashboard.json:/var/lib/grafana/dashboards/example-dashboard.json:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


  # Monitoring Storage - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - backend_app
      # backend_app:
      #   condition: service_healthy
    ports:
      - "9090:9090"
      # - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./configs/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped




  # Monitoring Logs - Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/config.yaml
    privileged: true
    depends_on:
      - backend_app
    ports:
      - "9080:9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/promtail-config.yaml:/etc/promtail/config.yaml
    networks:
      - app-network


  # Logs Storage - Loki
  loki:
    image: grafana/loki:latest
    container_name: loki
    depends_on:
      - backend_app
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - app-network


# Volumes
volumes:
  postgresdata:
    driver: local
  redisdata:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local


# Networks
networks:
  app-network:
    driver: bridge
    name: tg_web_app_network
