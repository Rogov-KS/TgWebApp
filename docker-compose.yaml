version: '3.8'

services:
  # Database Layer - Postgres SQL
  db:
    image: postgres:15
    container_name: tg_web_app_db
    env_file:
      - ./configs/envs/.env-prod
    ports:
      - "4321:5432"
      # - "${DB_PORT}:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


  # Cache Layer - Redis
  redis:
    image: redis:7-alpine
    container_name: tg_web_app_redis
    # command: redis-server --appendonly yes
    ports:
      - "6378:6379"
      # - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


  # Backend Layer - FastAPI
  backend_app:
    image: tg_web_app_backend
    container_name: tg_web_app_backend
    build:
      context: .
      dockerfile: ${DOCKER_FILE:-Dockerfile}
    command: sh -c "alembic upgrade head && gunicorn backend.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENV_MODE=prod
    ports:
      - "9000:8000"
      # - "${BACKEND_PORT}:8000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


  # Frontend Layer - React + Vite (dev mode)
  frontend_app:
    image: tg_web_app_frontend
    container_name: tg_web_app_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend_app
    environment:
      - VITE_API_URL=http://localhost:9000/api
      - VITE_BACKEND_URL=http://backend_app:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
    networks:
      - app-network
    restart: unless-stopped


  # # Celery Layer - Celery
  # celery:
  #   image: tg_web_app_celery
  #   container_name: tg_web_app_celery
  #   build:
  #     context: .
  #     dockerfile: ${DOCKER_FILE:-Dockerfile}
  #   command: sh -c "celery -A backend.celery_app.app:celery_app worker -l INFO"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - ./configs/envs/.env-prod
  #   networks:
  #     - app-network
  #   restart: unless-stopped


#   # # Celery Beat
