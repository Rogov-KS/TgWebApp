global:
  scrape_interval: 3s
  evaluation_interval: 15s

  external_labels:
    monitor: 'tgwebapp-monitor'

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "tgwebapp-backend"
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ["backend_app:8000"]
