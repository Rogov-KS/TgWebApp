version: '3.8'

services:
  db:
    image: postgres:15
    container_name: tg_web_app_db
    volumes:
      - postgresdata:/var/lib/postgresql/data
    env_file:
      - .env-non-dev
    ports:
      - 5423:5432
    networks:
      - app-network


  redis:
    image: redis:7
    container_name: tg_web_app_redis
    networks:
      - app-network


  backend_app:
    image: tg_web_app_backend
    build:
      context: .
    container_name: tg_web_app_backend
    env_file:
      - .env-non-dev
    depends_on:
      - db
      - redis
    # Если не работает эта команда, используйте закомментированную
    # command: ["/booking/docker/app.sh"]
    command: sh -c "alembic upgrade head && gunicorn backend.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind=0.0.0.0:8000"
    ports:
      - 9000:8000
    networks:
      - app-network


  celery:
    image: tg_web_app_celery
    build:
      context: .
    container_name: tg_web_app_celery
    command: sh -c "celery -A backend.celery_app.app:celery_app worker -l INFO"
    env_file:
      - .env-non-dev
    depends_on:
      - redis
    networks:
      - app-network


  # celery_beat:
  #   image: tg_web_app_celery
  #   build:
  #     context: . # celery это библиотека, у неё нет образа, берём из основного билда
  #   container_name: tg_web_app_celery_beat
  #   # Если не работает эта команда, используйте закомментированную
  #   # command: ["/booking/docker/celery.sh", "celery_beat"] # Второй аргумен для if/elif в скрипте
  #   command: sh -c "celery -A app.tasks.celery:celery worker -l INFO -B"
  #   env_file:
  #     - .env-non-dev
  #   depends_on:
  #     - redis


  flower:
    image: tg_web_app_flower
    build:
      context: .
    container_name: tg_web_app_flower
    command: sh -c "celery -A backend.celery_app.app:celery_app flower"
    # При запуске через nginx необходимо запускать команду ниже для корректной работы js и css
    # command: sh -c "celery --app=app.tasks.celery:celery flower --url_prefix=/flower"
    env_file:
      - .env-non-dev
    depends_on:
      - redis
    ports:
      - 5550:5555
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9080:9090"
    volumes:
      - ./backend/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3333:3000"
    env_file:
      - .env-non-dev
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/grafana/provisioning:/etc/grafana/provisioning
      - ./backend/grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgresdata:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
  # monitoring:
  #   driver: bridge
